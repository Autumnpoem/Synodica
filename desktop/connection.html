<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'">
<title>Synodica · Office connection</title>
<link rel="stylesheet" href="connection.css">
</head>
<body>
<main>
  <h1 id="title">Connect to office</h1>
  <p id="status" role="status"></p>
  <form id="form">
    <label><span id="url-label">Office URL</span><input id="url" type="url" placeholder="https://office.example.com/" autocomplete="url" required></label>
    <label><span id="token-label">Access token</span><input id="token" type="password" autocomplete="off" required></label>
    <p id="hint">Enter the current office access token. It is used for this sign-in only.</p>
    <p id="error" role="alert" hidden></p>
    <div class="actions"><button id="connect" type="submit">Connect</button><button id="local" type="button">Open local office</button></div>
  </form>
</main>
<script src="connection.js"></script>
</body>
</html>
